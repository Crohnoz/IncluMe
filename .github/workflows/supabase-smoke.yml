name: IncluMe Supabase Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feature/parking-community-mvp
    paths:
      - .github/workflows/supabase-smoke.yml

permissions:
  contents: read

jobs:
  public-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://azdrxkabzldwcmotzaor.supabase.co/functions/v1
      ORIGIN: https://inclume-chile.netlify.app
    steps:
      - name: Check approved catalog endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H "Origin: ${ORIGIN}" \
            -H "Accept: application/json" \
            -D /tmp/catalog-headers.txt \
            "${BASE_URL}/inclume-catalog" \
            -o /tmp/catalog.json
          jq -e '.ok == true and (.points | type == "array")' /tmp/catalog.json
          grep -qi "access-control-allow-origin: ${ORIGIN}" /tmp/catalog-headers.txt

      - name: Check aggregate metrics endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -H "Origin: ${ORIGIN}" \
            -H "Accept: application/json" \
            "${BASE_URL}/inclume-metrics" \
            -o /tmp/metrics.json
          jq -e '.ok == true and (.metrics.publishedLocations | type == "number") and (.metrics.citizenReportsReceived | type == "number")' /tmp/metrics.json

      - name: Check status endpoint privacy response
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --retry 3 --retry-delay 2 \
            -H "Origin: ${ORIGIN}" \
            -H "Accept: application/json" \
            -o /tmp/status.json \
            -w "%{http_code}" \
            "${BASE_URL}/inclume-status?ref=CIU-000000000000")
          test "$code" = "404"
          jq -e '.ok == false and (.message | type == "string")' /tmp/status.json
          ! jq -e 'has("observation") or has("email") or has("coordinates")' /tmp/status.json

      - name: Check intake endpoint without creating data
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --retry 3 --retry-delay 2 \
            -X POST \
            -H "Origin: ${ORIGIN}" \
            -H "Content-Type: application/json" \
            -d '{"kind":"citizen_report","bot-field":"automated-smoke-test"}' \
            -o /tmp/intake.json \
            -w "%{http_code}" \
            "${BASE_URL}/inclume-intake")
          test "$code" = "202"
          jq -e '.ok == true and .reference == "RECIBIDO"' /tmp/intake.json
