<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">IncluMe</title>
  <desc id="desc">Persona usuaria de silla de ruedas integrada en un pin de ubicación azul, turquesa y violeta.</desc>
  <defs>
    <linearGradient id="tile" x1="7" y1="5" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#075fc4"/>
      <stop offset="0.55" stop-color="#6846bd"/>
      <stop offset="1" stop-color="#007c70"/>
    </linearGradient>
  </defs>
  <style>
    .wheelchair-rider,
    .wheelchair-halo,
    .wheel-emphasis,
    .motion-streak {
      transform-box: fill-box;
    }

    .wheelchair-rider {
      transform-origin: center;
      animation: inclume-drive 4.8s cubic-bezier(.22, 1, .36, 1) infinite;
    }

    .wheelchair-halo {
      transform-origin: center;
      animation: inclume-halo 4.8s ease-out infinite;
    }

    .wheel-emphasis {
      transform-origin: center;
      stroke-dasharray: 6 3;
      animation: inclume-wheel 4.8s linear infinite;
    }

    .motion-streak {
      stroke-dasharray: 7 12;
      animation: inclume-streak 4.8s ease-out infinite;
    }

    @keyframes inclume-drive {
      0%, 16%, 58%, 100% { transform: translate(0, 0); }
      26% { transform: translate(1.8px, -0.7px); }
      36% { transform: translate(0.5px, 0); }
      44% { transform: translate(1.2px, -0.35px); }
    }

    @keyframes inclume-halo {
      0%, 16%, 58%, 100% { opacity: 0; transform: scale(.72); }
      29% { opacity: .86; transform: scale(1); }
      48% { opacity: 0; transform: scale(1.22); }
    }

    @keyframes inclume-wheel {
      0%, 16%, 58%, 100% { opacity: 0; stroke-dashoffset: 0; }
      24% { opacity: .95; }
      48% { opacity: .45; stroke-dashoffset: -18; }
    }

    @keyframes inclume-streak {
      0%, 16%, 58%, 100% { opacity: 0; stroke-dashoffset: 8; }
      26% { opacity: .9; }
      48% { opacity: 0; stroke-dashoffset: -10; }
    }

    @media (prefers-reduced-motion: reduce) {
      .wheelchair-rider,
      .wheelchair-halo,
      .wheel-emphasis,
      .motion-streak {
        animation: none;
        transform: none;
      }

      .wheelchair-halo,
      .wheel-emphasis,
      .motion-streak {
        opacity: 0;
      }
    }
  </style>
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#tile)"/>
  <path d="M32 8.5c-10.5 0-19 8.2-19 18.3 0 12.8 19 28.7 19 28.7s19-15.9 19-28.7C51 16.7 42.5 8.5 32 8.5Z" fill="#fff"/>
  <circle class="wheelchair-halo" cx="32" cy="34.5" r="13" fill="none" stroke="#55e3cf" stroke-width="1.6" opacity="0"/>
  <g class="motion-streak" fill="none" stroke="#55e3cf" stroke-width="1.7" stroke-linecap="round" opacity="0">
    <path d="M17.5 30.5h5.5"/>
    <path d="M16.5 35h5"/>
  </g>
  <g class="wheelchair-rider">
    <g fill="none" stroke="#075fc4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="31.2" cy="36.2" r="8.1"/>
      <path d="M28.2 25.7v7.5c0 1.7 1.3 3 3 3h8"/>
      <path d="M29.3 29h7.8l3.1 6.7h5.7"/>
      <path d="M38.9 35.8l3.5 6h5"/>
    </g>
    <circle class="wheel-emphasis" cx="31.2" cy="36.2" r="9.45" fill="none" stroke="#55e3cf" stroke-width="1.35" opacity="0"/>
    <circle cx="27.8" cy="20.9" r="3.6" fill="#075fc4"/>
    <circle cx="31.2" cy="36.2" r="2" fill="#007c70"/>
  </g>
</svg>
