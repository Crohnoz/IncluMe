services:
  - type: web
    name: inclume-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn IncluMe.wsgi:application
    healthCheckPath: /parking/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: inclume-app.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://inclume-app.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: inclume-db
          property: connectionString

databases:
  - name: inclume-db
    plan: free
